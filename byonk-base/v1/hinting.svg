{# Retained for compatibility — this partial no longer configures hinting.

   Hinting is applied by the server now, adaptively per panel, and needs
   nothing in the document. Override it from Lua with the `font_hinting`
   directive (see the Font Hinting page in the docs).

   Including this is inert: `shape-rendering` is read by usvg only when it
   converts a *shape* element, while `<text>` takes its rasterization from
   `text-rendering`. It is emitted unchanged purely so that an out-of-tree
   screen including this from a non-text rule keeps the behaviour it had.

   New screens should not include this at all.

   Usage: {% include "byonk-base-v1/hinting.svg" %} inside a CSS rule. #}
shape-rendering: crispEdges;
