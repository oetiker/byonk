{#
  Reusable status bar component with icon indicators.

  Usage:
    {% set wifi_status = data.wifi %}
    {% set battery_level = data.batt %}
    {% include "byonk-base-v1/status_bar.svg" %}

  A screen's Lua data arrives under `data.*`, so name each variable with
  `{% set %}` before including. Anything left unset falls back to a default.

  Expected variables:
    - wifi_status: "connected" | "disconnected" | "unknown" (optional)
    - battery_level: 0-100 (optional)
    - status_y: Y position (default: 15)
    - status_color: Ink for the icons (default: "rgb(200,200,200)")

  It draws into the top-right corner of `header.svg`'s black bar, so the ink
  defaults to light. On a white background set a dark `status_color`:

    {% set status_color = "rgb(80,80,80)" %}
    {% set status_y = 70 %}

  When extending `base.svg`, put the include in the `header_extra` block —
  that block exists for exactly this and is drawn over the header bar.
#}
<g transform="translate({{ width | default(value=800) - 80 }}, {{ status_y | default(value=15) }})">
  <!-- WiFi indicator. `is defined` first, like the battery below: comparing an
       unset variable against a string is a hard error in Tera, so without this
       guard the component could not be used without setting wifi_status —
       which its own notes above call optional. -->
  {% if wifi_status is defined %}
  {% if wifi_status == "connected" %}
  <path d="M0,12 L4,4 L8,12 M2,9 L4,6 L6,9 M3.5,7 L4,6.5 L4.5,7" fill="none" stroke="{{ status_color | default(value='rgb(200,200,200)') }}" stroke-width="1.5"/>
  {% elif wifi_status == "disconnected" %}
  <path d="M0,12 L4,4 L8,12" fill="none" stroke="{{ status_color | default(value='rgb(200,200,200)') }}" stroke-width="1.5"/>
  <line x1="1" y1="5" x2="7" y2="11" stroke="{{ status_color | default(value='rgb(200,200,200)') }}" stroke-width="1.5"/>
  {% endif %}
  {% endif %}

  <!-- Battery indicator -->
  {% if battery_level is defined %}
  <rect x="20" y="4" width="24" height="10" rx="2" fill="none" stroke="{{ status_color | default(value='rgb(200,200,200)') }}" stroke-width="1"/>
  <rect x="44" y="6" width="2" height="6" fill="{{ status_color | default(value='rgb(200,200,200)') }}"/>
  {% if battery_level > 20 %}
  <rect x="22" y="6" width="{{ (battery_level / 100 * 20) | round }}" height="6" fill="{{ status_color | default(value='rgb(200,200,200)') }}"/>
  {% else %}
  <rect x="22" y="6" width="{{ (battery_level / 100 * 20) | round }}" height="6" fill="rgb(220,90,90)"/>
  {% endif %}
  {% endif %}
</g>
