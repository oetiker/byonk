configuration:
  admin_token:
    name: Admin token
    description: >-
      Managed automatically by the Byonk Home Assistant integration. Leave this
      blank — you do not need to set it by hand. While empty, the management API
      stays disabled.
  log_level:
    name: Log level
    description: Verbosity of the Byonk server log.
  dev_username:
    name: Dev UI username
    description: >-
      Only needed to open the screen editor from outside Home Assistant
      (http://<host>:3000/dev/). Inside Home Assistant use the Byonk sidebar entry.
  dev_password:
    name: Dev UI password
    description: Password for the username above. Leave both blank to disable the external login.
