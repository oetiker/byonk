title: Gamut Patches
description: Flat patches across the full hue circle at several lightness levels — shows which hues the panel can actually mix and which collapse to a single flat colour.
byonk: "0.19"
refresh: 3600
params:
  hues:
    type: int
    label: "Hue columns"
    description: "How many hues to sample around the full circle"
    default: 24
    min: 2
    max: 48
    mode: box
  levels:
    type: int
    label: "Lightness rows"
    description: "How many lightness levels to sample per hue"
    default: 6
    min: 1
    max: 12
    mode: box
