<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Byonk Dev</title>
<link rel="stylesheet" href="dev.css">
<!-- Applies the stored colour-scheme choice before first paint. Without it a
     stored "Dark" on a light-system machine paints the light scheme for one
     frame. Must stay self-contained: it runs long before dev.js loads.
     login.html carries its own copy -- it is a separate document. -->
<script>
(function () {
  try {
    var t = localStorage.getItem("byonk-dev-theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) { /* private window or blocked site data: keep the default */ }
})();
</script>
</head>
<body>
<header class="topbar">
  <strong>Byonk</strong>
  <span id="current-ref" class="pill">no screen</span>
  <span class="spacer"></span>
  <span id="watch-status" class="status-badge disconnected">File Watch: Connecting...</span>
  <button id="simulate-toggle" class="ghost">Simulate</button>
  <button id="save-btn" class="primary" disabled>Save</button>
  <!-- Three-way, not a toggle: a two-state switch cannot express "follow the
       system again", so a user who touched it could never get back to the
       default. dev.js keeps this in sync with `data-theme` on <html>. -->
  <select id="theme-select" class="theme-select" aria-label="Colour scheme">
    <option value="system">System</option>
    <option value="light">Light</option>
    <option value="dark">Dark</option>
  </select>
  <span id="whoami" class="muted"></span>
  <form id="logout-form" method="post" action="logout" hidden><button class="ghost">Logout</button></form>
</header>
<main class="columns">
  <aside class="screens">
    <div class="toolbar">
      <button id="new-btn">New</button>
      <button id="copy-btn" disabled>Copy</button>
      <button id="rename-btn" disabled>Rename</button>
      <button id="delete-btn" disabled>Delete</button>
    </div>
    <form id="inline-form" class="inline-form" hidden>
      <span id="inline-title"></span>
      <select id="inline-repo"></select>
      <input id="inline-name" placeholder="name" required>
      <button type="submit">OK</button>
      <button type="button" id="inline-cancel">Cancel</button>
    </form>
    <div id="screen-list"></div>
  </aside>
  <section class="editor">
    <div id="tabs" class="tabs"></div>
    <div id="editor-host"></div>
    <!-- Sticky failure bar. `#problems` below is repainted by the next
         keystroke's check and `#console` is cleared by every render, so a
         failure the user must act on gets its own region, dismissed only by
         the user or by the next successful write. -->
    <div id="failure-bar" class="failure-bar" role="alert" hidden>
      <span id="failure-text"></span>
      <button type="button" id="failure-dismiss" class="failure-dismiss" aria-label="Dismiss">&times;</button>
    </div>
    <div id="problems" class="problems"></div>
  </section>
  <section class="preview">
    <div class="preview-head">
      <span id="display-size">800 x 480</span>
      <span id="render-time"></span>
      <button id="popout-btn" class="ghost">Pop out</button>
    </div>
    <div id="device-frame" class="device-frame og">
      <div class="device-bezel"><div class="screen-well">
        <img id="display-image" alt="Screen preview">
        <div id="loading-overlay" class="loading-overlay hidden"><div class="spinner"></div></div>
      </div><div id="bezel-label" class="bezel-label">BYONK</div></div>
    </div>
    <div id="console" class="console"><pre id="console-output"></pre></div>
    <div id="drawer" class="drawer" hidden><!-- Task 9 moves the configuration panel here --></div>
  </section>
</main>

<div id="color-popup" class="color-popup hidden">
    <div class="color-popup-header">
        <span>Adjust Color</span>
        <button class="color-popup-close" id="color-popup-close">&times;</button>
    </div>
    <div class="color-popup-preview">
        <div class="preview-box" id="popup-original-color"></div>
        <span class="preview-arrow">&rarr;</span>
        <div class="preview-box" id="popup-live-color"></div>
    </div>
    <div class="color-popup-slider">
        <label>Hue <span id="popup-hue-val">0</span></label>
        <input type="range" id="popup-hue" min="0" max="360" value="0">
    </div>
    <div class="color-popup-slider">
        <label>Saturation <span id="popup-sat-val">0%</span></label>
        <input type="range" id="popup-sat" min="0" max="100" value="0">
    </div>
    <div class="color-popup-slider">
        <label>Lightness <span id="popup-lit-val">0%</span></label>
        <input type="range" id="popup-lit" min="0" max="100" value="0">
    </div>
    <div class="color-popup-hex">
        <label>Hex</label>
        <input type="text" id="popup-hex-input" maxlength="7" placeholder="#000000">
    </div>
    <button class="color-popup-reset" id="popup-reset-btn">Reset to original</button>
</div>

<script src="editor.bundle.js"></script>
<script src="dev.js"></script>
</body>
</html>
