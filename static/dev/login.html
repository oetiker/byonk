<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Byonk Login</title>
<link rel="stylesheet" href="dev.css">
<!-- Same before-first-paint scheme applier as index.html. This is the first
     page a user sees, and it is a separate document, so it needs its own
     copy; there is no dev.js here at all. -->
<script>
(function () {
  try {
    var t = localStorage.getItem("byonk-dev-theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) { /* private window or blocked site data: keep the default */ }
})();
</script>
</head>
<body class="login-body">
<form class="login-card" method="post" action="login">
  <h1>Byonk</h1>
  <p class="login-message">{{message}}</p>
  <label>Username <input name="username" autocomplete="username" autofocus required></label>
  <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
  <button type="submit">Log in</button>
</form>
</body>
</html>
